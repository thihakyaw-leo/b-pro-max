<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>b-pro-max — LoginView (WinUI 3 Mockup)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Segoe UI Variable", "Segoe", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #07889b 0%, #1e3c72 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }

  /* WinUI 3 Card — centered, max-width 400, Padding 24 */
  .card {
    width: 100%;
    max-width: 400px;
    padding: 24px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    display: grid;
    gap: 12px;
    grid-template-rows: auto auto auto auto auto auto;
  }

  /* Title — TitleTextBlockStyle equivalent (28px, SemiLight) */
  .title {
    font-size: 28px;
    font-weight: 300;
    color: #2d2d2d;
    text-align: center;
    margin: 0;
    letter-spacing: -0.5px;
  }

  /* Subtitle — SubtitleTextBlockStyle equivalent (20px, Light) */
  .subtitle {
    font-size: 20px;
    font-weight: 300;
    color: #2d2d2d;
    text-align: center;
    margin: 0;
  }

  /* Label text blocks */
  .label {
    font-size: 14px;
    font-weight: 400;
    color: #2d2d2d;
    margin: 0 0 6px 0;
  }

  /* TextBox / PasswordBox — WinUI 3 default styling */
  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    font-size: 14px;
    font-family: inherit;
    color: #2d2d2d;
    background: #ffffff;
    border: 1.5px solid #d2d2d2;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 6px;
  }

  input[type="text"]::placeholder,
  input[type="password"]::placeholder {
    color: #8a8a8a;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #0078d4;
    box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.2);
  }

  /* Button — WinUI 3 default button (Height 40, Stretch) */
  button.login-btn {
    width: 100%;
    height: 40px;
    margin-top: 8px;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    color: #ffffff;
    background: #0078d4;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button.login-btn:hover {
    background: #2b88d8;
  }

  button.login-btn:active {
    background: #005a9e;
    transform: scale(0.98);
  }

  button.login-btn:focus-visible {
    outline: 2px solid #0078d4;
    outline-offset: 2px;
  }

  /* StatusMessage TextBlock */
  .status {
    font-size: 14px;
    font-weight: 400;
    text-align: center;
    margin: 0;
    min-height: 20px;
    color: #d13438; /* SystemControlErrorTextForegroundBrush */
  }

  .status.success {
    color: #107c10; /* SystemControlSuccessTextForegroundBrush */
  }

  .status.empty {
    color: transparent;
  }

  /* WinUI 3 window chrome hint */
  .window-hint {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="window-hint">b-pro-max · LoginView (WinUI 3 Page)</div>

<div class="card" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <h1 class="title">b-pro-max</h1>
  <h2 class="subtitle" id="login-title">Login</h2>

  <label class="label" for="username-box">Username</label>
  <input type="text" id="username-box" placeholder="Username">

  <label class="label" for="password-box">Password</label>
  <input type="password" id="password-box" placeholder="Password">

  <button class="login-btn" id="login-button">Login</button>

  <p class="status empty" id="status-message"></p>
</div>

<script>
  const usernameBox = document.getElementById('username-box');
  const passwordBox = document.getElementById('password-box');
  const loginButton = document.getElementById('login-button');
  const statusMessage = document.getElementById('status-message');

  // Simulate the Login_Click handler logic
  loginButton.addEventListener('click', async () => {
    statusMessage.textContent = '';
    statusMessage.className = 'status empty';

    const username = usernameBox.value.trim();
    const password = passwordBox.value;

    // Simulate AuthService.LoginAsync delay
    loginButton.disabled = true;
    loginButton.textContent = 'Signing in...';

    await new Promise(r => setTimeout(r, 800));

    // Mock: accept "admin" / "password" or any non-empty credentials
    if (username && password) {
      statusMessage.textContent = `Welcome, ${username}!`;
      statusMessage.className = 'status success';
      loginButton.textContent = 'Login';
      loginButton.disabled = false;
      // Simulate navigation to AgentListView
      setTimeout(() => {
        document.body.innerHTML = `
          <div style="font-family:Segoe UI; padding:40px; color:#2d2d2d;">
            <h2 style="font-size:20px; font-weight:400; color:#0078d4;">✅ Login Successful</h2>
            <p>Welcome, <strong>${username}</strong>.</p>
            <p style="margin-top:24px; font-size:14px; color:#666;">In the real app, this would navigate to <code>AgentListView</code> and call <code>App.MainWindowInstance.UpdateMenuState()</code>.</p>
          </div>`;
      }, 600);
    } else {
      statusMessage.textContent = "Invalid username or password.";
      statusMessage.className = 'status';
      loginButton.textContent = 'Login';
      loginButton.disabled = false;
    }
  });

  // Allow Enter key to submit
  [usernameBox, passwordBox].forEach(input => {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginButton.click();
    });
  });
</script>

</body>
</html>
